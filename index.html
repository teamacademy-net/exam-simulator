<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ExamSim – Exam Simulator</title>
  <meta name="description" content="A professional-style computer-based exam simulator for students: timed exams, review screen, flagging, breaks, and detailed score reports.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <noscript><p style="padding:24px">This exam simulator needs JavaScript enabled.</p></noscript>
  <div id="app" aria-live="polite"></div>

  <!-- Branding / settings -->
  <script src="js/config.js"></script>

  <!-- Login (Supabase): library, your project settings, sign-in screens -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>

  <!-- Question banks: each file adds one exam to window.EXAM_BANK.
       To add an exam, create a new file in /exams and add a <script> line here. -->
  <script src="exams/pmp-style-sample.js"></script>
  <script src="exams/agile-foundations-sample.js"></script>

  <!-- Application -->
  <script src="js/app.js"></script>
</body>
</html>
